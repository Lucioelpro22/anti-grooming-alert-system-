name: Libro Recuerdos y Suenos

on:
  push:
    paths:
      - "libro-recuerdos-suenos/**"
      - ".github/workflows/libro-recuerdos.yml"
  pull_request:
    paths:
      - "libro-recuerdos-suenos/**"
      - ".github/workflows/libro-recuerdos.yml"

permissions:
  contents: read

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: libro-recuerdos-suenos
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: libro-recuerdos-suenos/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt ruff
      - run: ruff check api tests
      - run: pytest -q

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
