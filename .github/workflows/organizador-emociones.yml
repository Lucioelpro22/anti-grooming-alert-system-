name: Organizador Emociones
on:
  push:
    paths:
      - "VERSION"
      - "organizador-emociones/**"
      - "requirements-education-ci.in"
      - "requirements-education-ci.txt"
      - ".github/workflows/organizador-emociones.yml"
  pull_request:
    paths:
      - "organizador-emociones/**"
      - "requirements-education-ci.in"
      - "requirements-education-ci.txt"
      - ".github/workflows/organizador-emociones.yml"
permissions:
  contents: read
jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: organizador-emociones
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            organizador-emociones/requirements.txt
            requirements-education-ci.txt
      - name: Install locked project and CI dependencies
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r ../requirements-education-ci.txt -r requirements.txt
      - run: python -m pip check
      - run: ruff check api tests
      - run: pytest -q
      - name: Audit project dependencies
        run: python -m pip_audit -r requirements.txt
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
