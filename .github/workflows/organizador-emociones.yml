name: Organizador Emociones
on:
  push:
    paths:
      - "organizador-emociones/**"
      - ".github/workflows/organizador-emociones.yml"
  pull_request:
    paths:
      - "organizador-emociones/**"
      - ".github/workflows/organizador-emociones.yml"
permissions:
  contents: read
jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: organizador-emociones
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: organizador-emociones/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt ruff
      - run: ruff check api tests
      - run: pytest -q
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
