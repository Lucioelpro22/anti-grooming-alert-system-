name: Container security

on:
  push:
    branches: [main, "security/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: container-security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-scan:
    name: Build, SBOM and scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Validate hardened Compose profile
        shell: bash
        env:
          HEALTHCHECK_HOST: api.example.org
          ALLOWED_HOSTS_JSON: '["api.example.org"]'
        run: |
          set -eu
          mkdir -p secrets
          trap 'rm -rf secrets' EXIT
          for name in jwt_secret auth_users_json mfa_users_json evidence_encryption_key audit_hmac_key pseudonymization_hmac_key redis_url; do
            printf 'placeholder\n' > "secrets/${name}"
          done
          docker compose -f compose.production.yml config --quiet

      - name: Build local security-test image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          push: false
          tags: anti-grooming-alert-system:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false

      - name: Verify runtime hardening
        shell: bash
        run: |
          set -euo pipefail
          image=anti-grooming-alert-system:ci
          test "$(docker image inspect "$image" --format '{{.Config.User}}')" = "10001:10001"
          test "$(docker image inspect "$image" --format '{{json .Config.Entrypoint}}')" = '["/bin/sh","/app/scripts/container-entrypoint.sh"]'
          test "$(docker image inspect "$image" --format '{{.Config.StopSignal}}')" = "SIGTERM"
          docker image inspect "$image" --format '{{json .Config.Healthcheck.Test}}' | grep -q '/health/ready'
          docker run --rm --entrypoint /usr/bin/id "$image" -u | grep -qx '10001'
          docker run --rm --entrypoint /bin/sh "$image" -ec '
            test ! -e /opt/venv/bin/pip
            test ! -e /usr/local/bin/pip
            test ! -w /app/api
            test ! -w /app/scripts
            test ! -w /opt/venv
          '

      - name: Generate image SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: anti-grooming-alert-system:ci
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Scan image vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: anti-grooming-alert-system:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

      - name: Upload SBOM
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: container-sbom-${{ github.sha }}
          path: sbom.spdx.json
          if-no-files-found: warn
          retention-days: 14
