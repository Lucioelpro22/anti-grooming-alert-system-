name: Semaforo Conversaciones Digitales

on:
  push:
    paths:
      - "semaforo-conversaciones-digitales/**"
      - ".github/workflows/semaforo-conversaciones.yml"
  pull_request:
    paths:
      - "semaforo-conversaciones-digitales/**"
      - ".github/workflows/semaforo-conversaciones.yml"

permissions:
  contents: read

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: semaforo-conversaciones-digitales
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: semaforo-conversaciones-digitales/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt ruff
      - run: ruff check api tests
      - run: pytest -q

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
