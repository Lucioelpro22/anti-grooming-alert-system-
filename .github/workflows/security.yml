name: Security and quality

on:
  push:
    branches: [main, "security/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  postgres-persistence:
    name: PostgreSQL persistence integration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17.11-bookworm@sha256:858bb5e98eed02eb8cafbcdc007f9a65d1b613972028944a8ec2133ccaf80d27
        env:
          POSTGRES_USER: persistence_test
          POSTGRES_DB: persistence_test
          # Disposable CI service, reachable only through the runner's loopback.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U persistence_test -d persistence_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-postgres-ci.txt
      - name: Install API dependencies and test runner
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements-postgres-ci.txt -r api/requirements.txt
          python -m pip check
      - name: Run PostgreSQL persistence integration tests
        env:
          TEST_POSTGRES_URL: postgresql+psycopg://persistence_test@127.0.0.1:5432/persistence_test
        run: python -m pytest -q tests/test_postgres_persistence.py

  test-and-scan:
    name: Test and security scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements.txt

      - name: Install runtime and security tools
        id: install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r api/requirements.txt
          python -m pip install bandit detect-secrets httpx2 mypy pip-audit pytest ruff
          python -m pip check

      - name: Check formatting and lint
        run: |
          python -m ruff format --check api tests scripts
          python -m ruff check api tests scripts

      - name: Check types
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: python -m mypy --cache-dir /tmp/mypy-cache api

      - name: Run tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: python -m pytest -q

      - name: Run Bandit
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: python -m bandit -q -r api scripts

      - name: Audit dependencies
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: python -m pip_audit -r api/requirements.txt

      - name: Scan repository for secrets
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        shell: bash
        run: |
          python -m detect_secrets scan --all-files \
                        --exclude-files '^(\.git/|\.mypy_cache/|\.pytest_cache/|\.ruff_cache/|informes_generados/)' \
            > /tmp/secrets.json
          python - <<'PY'
          import json
          from pathlib import Path

          results = json.loads(Path("/tmp/secrets.json").read_text())["results"]
          findings = sum(len(matches) for matches in results.values())
          if findings:
              for path, matches in sorted(results.items()):
                  for match in matches:
                      line = match.get("line_number", "?")
                      detector = match.get("type", "unknown")
                      print(f"{path}:{line}: {detector}")
              raise SystemExit(f"detect-secrets found {findings} potential secret(s)")
          print("detect-secrets: 0 potential secrets")
          PY

      - name: Validate patch whitespace
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: git diff --check
